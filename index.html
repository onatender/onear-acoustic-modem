    incoming.set(id,new Assembly(p));
  }
  const a=incoming.get(id);
  if(a.total!==p.total||a.exact!==p.exact)return;
  a.add(p);
  if(p.type===END)a.ended=true;
  if(!a.result&&!a.checking){
    $('rx').classList.remove('verified');
    $('rx').textContent='Receiving · '+a.parts.size+' / '+a.total+' packets';
    if(a.parts.size===a.total){
      a.checking=true;
      try{a.result=await a.verify()}finally{a.checking=false}
      if(capture!==session)return;
      if(!a.result){$('rx').textContent='File verification failed';a.parts.clear();a.parity.clear();a.weighted.clear();return}
      const result=a.result;
      if(downloadURL)URL.revokeObjectURL(downloadURL);
      $('download').hidden=!result.file;
      $('output').value=result.file?'':dec.decode(result.bytes);
      if(result.file){
        downloadURL=URL.createObjectURL(new Blob([result.bytes]));
        $('download').href=downloadURL;$('download').download=result.name;
        $('download').textContent=result.name+' · Download';
      }
      $('rx').textContent=result.bytes.length+' bytes · Verified';
      $('rx').classList.add('verified');
    }
  }
  if(!local&&p.exact&&a.ended&&!a.checking&&!reply&&!job){
    a.ended=false;
    const owner={band:p.band};reply=owner;
    try{
      await wait(180);
      if(capture===session&&!owner.cancelled){
        const missing=new Uint8Array(Math.ceil(a.total/8));
        for(let i=0;i<a.total;i++)if(!a.parts.has(i))missing[i>>3]|=1<<(i%8);
        const response=a.result?packet(ACK,p.id,0,p.total,a.result.digest,true):packet(REQUEST,p.id,0,p.total,missing,true);
        await play([response],owner);
      }
    }finally{if(reply===owner)reply=null}
  }
}
let captureModule;
    const workletCode = `
      class ToneCapture extends AudioWorkletProcessor {
        constructor() {
          super();
          this.batch = new Float32Array(2048);
          this.index = 0;
        }
        process(inputs) {
          const channel = inputs[0]?.[0];
          if (!channel) return true;
          for (const sample of channel) {
            this.batch[this.index++] = sample;
            if (this.index === this.batch.length) {
              this.port.postMessage(this.batch, [this.batch.buffer]);
              this.batch = new Float32Array(2048);
              this.index = 0;
            }
          }
          return true;
        }
      }
      registerProcessor('tone-capture', ToneCapture);
    `;

    function loadCaptureModule(audio) {
      if (!captureModule) {
        const url = URL.createObjectURL(new Blob([workletCode], { type: 'text/javascript' }));
        captureModule = audio.audioWorklet.addModule(url)
          .finally(() => URL.revokeObjectURL(url))
          .catch(error => { captureModule = null; throw error; });
      }
      return captureModule;
    }

    async function createCaptureNode(audio, feed) {
      // Local files have an opaque origin in some browsers, which blocks
      // the blob URL used by the inline worklet.
      if (location.protocol !== 'file:' && audio.audioWorklet && typeof AudioWorkletNode === 'function') {
        try {
          await loadCaptureModule(audio);
          const node = new AudioWorkletNode(audio, 'tone-capture');
          node.port.onmessage = event => feed(event.data);
          return { node, close: () => {
            node.port.onmessage = null;
            node.port.close();
          } };
        } catch (error) {
          if (typeof audio.createScriptProcessor !== 'function') throw error;
        }
      }
      if (typeof audio.createScriptProcessor !== 'function') {
        throw new Error('Open this page over HTTPS or localhost to use the microphone.');
      }
      const node = audio.createScriptProcessor(1024, 1, 1);
      node.onaudioprocess = event => feed(event.inputBuffer.getChannelData(0));
      return { node, close: () => { node.onaudioprocess = null; } };
    }

function closeMic(){
  const c=capture;capture=null;
  if(reply){reply.cancelled=true;reply.source?.stop()}
  c?.stream?.getTracks().forEach(t=>t.stop());
  for(const n of c?.nodes||[])n.disconnect();
  c?.closeInput?.();
  $('listen').textContent='Listen';$('mic').textContent='Microphone off';
}
async function microphone(){
  if(capture)return capture.ready;
  const c={nodes:[]};capture=c;
  c.ready=(async()=>{
    try{
      const ac=await audio();
      if(!navigator.mediaDevices?.getUserMedia)throw Error('Microphone access requires HTTPS, localhost or a local file.');
      const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      if(capture!==c){stream.getTracks().forEach(t=>t.stop());throw Error('Listening stopped.')}
      c.stream=stream;
      const decoder=new Decoder(p=>handle(p,c).catch(e=>{$('rx').textContent=e.message}));
      const input=await createCaptureNode(ac,samples=>{
        decoder.feed(samples);
        if(!job)drawSignal(samples);
      });
      if(capture!==c){input.close();throw Error('Listening stopped.')}
      c.closeInput=input.close;
      const src=ac.createMediaStreamSource(stream),proc=input.node,mute=ac.createGain();
      mute.gain.value=0;c.nodes=[src,proc,mute];
      src.connect(proc).connect(mute).connect(ac.destination);
      stream.getAudioTracks()[0].onended=()=>{if(capture===c)closeMic()};
      $('mic').textContent='Microphone on';$('listen').textContent='Stop listening';
    }catch(e){if(capture===c)closeMic();throw e}
  })();return c.ready;
}
function hint(){
  const file=$('file').files[0],bytes=file?.size??enc.encode($('message').value).length;
  $('remove').hidden=!file;$('message').disabled=!!file||!!job;
  if(!file&&!bytes){$('hint').textContent='File limit: 32 KiB';return}
  const n=Math.ceil((38+enc.encode(file?.name||'').length+bytes)/CHUNK);
  const parityCount=$('mode').value==='exact'?2:1;
  const seconds=(n+parityCount*Math.ceil(n/4)+1)*bands[$('band').value].frame/RATE;
  $('hint').textContent=(file?file.name+' · ':'')+bytes+' bytes · '+seconds.toFixed(1)+' s per pass';
}
$('file').onchange=$('message').oninput=$('mode').onchange=$('band').onchange=hint;
$('remove').onclick=()=>{$('file').value='';hint()};
$('listen').onclick=async()=>{try{if(capture)closeMic();else await microphone()}catch(e){$('rx').classList.remove('verified');$('rx').textContent=e.message}};
$('clear').onclick=()=>{
  $('output').value='';
  if(downloadURL)URL.revokeObjectURL(downloadURL);
  downloadURL=null;
  const link=$('download');
  link.hidden=true;link.removeAttribute('href');link.removeAttribute('download');
  link.textContent='Download file';
  $('rx').classList.remove('verified');
  $('rx').textContent=capture?'Listening':'Idle';
};
$('stop').onclick=()=>{if(job){job.cancelled=true;job.source?.stop();$('tx').textContent='Stopped'}};
$('send').onclick=async()=>{
  if(job||reply)return;
  $('tx').classList.remove('verified');
  const owner={band:bands[$('band').value],exact:$('mode').value==='exact'};job=owner;
  for(const id of ['file','remove','mode','band','send','listen'])$(id).disabled=true;
  $('stop').disabled=false;hint();
  let opened=false;
  try{
    const file=$('file').files[0];
    if(file?.size>MAX_FILE)throw Error('Choose a file up to 32 KiB.');
    if(!file&&!$('message').value)throw Error('Enter a message or choose a file.');
    await audio();
    const bytes=file?new Uint8Array(await file.arrayBuffer()):enc.encode($('message').value);
    const {wire,digest}=await envelope(bytes,file?.name||'',!!file);
    const id=crypto.getRandomValues(new Uint8Array(8));
    owner.key=key(id);owner.digest=digest;own.add(owner.key);
    if(own.size>32)own.delete(own.values().next().value);
    if(owner.exact&&!owner.cancelled){opened=!capture;await microphone()}
    const packets=frames(wire,id,owner.exact);
    for(let attempt=1;attempt<=(owner.exact?3:1)&&!owner.cancelled;attempt++){
      $('tx').textContent='Sending · attempt '+attempt;
      const missing=owner.request;owner.request=null;
      const batch=missing?packets.filter(p=>{
        const index=p[12]*256+p[13];
        return p[1]===END||(p[1]===DATA&&(missing[index>>3]&(1<<(index%8))));
      }):packets;
      await play(batch,owner);
      if(owner.cancelled)break;
      if(!owner.exact){$('tx').textContent='Sent · '+bytes.length+' bytes';break}
      $('tx').textContent='Waiting for confirmation';
      const deadline=Date.now()+1800;
      while(!owner.confirmed&&!owner.request&&!owner.cancelled&&Date.now()<deadline)await wait(30);
      if(owner.confirmed){
        $('tx').textContent='Delivery confirmed · '+bytes.length+' bytes';
        $('tx').classList.add('verified');
        break;
      }
      if(attempt===3)$('tx').textContent='Delivery unconfirmed';
    }
  }catch(e){$('tx').textContent=e.message}finally{
    if(opened)closeMic();job=null;
    for(const id of ['file','remove','mode','band','send','listen'])$(id).disabled=false;
    $('stop').disabled=true;hint();
  }
};hint();
</script></html>
